<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FPS Preview</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #0A0A0A;
    color: #FFFFFF;
    font-family: 'Inter', sans-serif;
    padding: 20px;
    min-height: 100vh;
  }
  .container { max-width: 600px; margin: 0 auto; }

  .fps-wrap {
    background: #141414;
    border-radius: 16px;
    padding: 1.5rem 1.25rem;
    border: 1px solid rgba(255,255,255,0.06);
  }
  .fps-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 18px;
    padding-bottom: 14px;
    border-bottom: 1px solid rgba(255,255,255,0.06);
  }
  .fps-title {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 17px;
    font-weight: 700;
    margin: 0;
  }
  .fps-res {
    font-size: 11px;
    color: #9CA3AF;
    background: rgba(255,255,255,0.05);
    padding: 4px 10px;
    border-radius: 999px;
  }

  .game-row {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 12px 0;
    border-bottom: 1px solid rgba(255,255,255,0.04);
  }
  .game-row:last-child { border-bottom: none; padding-bottom: 0; }
  .game-row:first-of-type { padding-top: 0; }

  .game-logo {
    width: 48px;
    height: 48px;
    border-radius: 10px;
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(255,255,255,0.06);
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    padding: 7px;
  }
  .game-logo img {
    max-width: 100%;
    max-height: 100%;
    object-fit: contain;
  }

  .game-info { flex: 1; min-width: 0; }
  .game-name {
    font-size: 14px;
    font-weight: 600;
    margin: 0;
    color: #FFFFFF;
  }
  .game-settings {
    font-size: 11px;
    color: #6B7280;
    margin-top: 2px;
  }

  .fps-range {
    text-align: right;
    flex-shrink: 0;
  }
  .fps-value {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 18px;
    font-weight: 700;
    color: #5BC78A;
    line-height: 1;
    white-space: nowrap;
  }
  .fps-label {
    font-size: 10px;
    color: #6B7280;
    margin-top: 4px;
    text-transform: uppercase;
    letter-spacing: 0.05em;
  }

  .fps-note {
    margin-top: 16px;
    font-size: 11px;
    color: #6B7280;
    text-align: center;
    line-height: 1.5;
  }
</style>
</head>
