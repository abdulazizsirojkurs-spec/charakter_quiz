    <style>
        :root {
            --bg: #0a0a0a;
            --card-bg: #141414;
            --border: #1e1e1e;
            --accent: #00ff88;
            --accent-hover: #00cc6a;
            --text-main: #ffffff;
            --text-muted: #b0b0b0;
            --danger: #ff4444;
            --success: #00ff88;
            --font-main: 'Segoe UI', 'Inter', system-ui, sans-serif;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: var(--font-main);
        }

        body {
            background-color: var(--bg);
            color: var(--text-main);
            line-height: 1.6;
        }

        /* --- Header --- */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1.5rem 5%;
            background-color: #050505;
            border-bottom: 1px solid var(--border);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo h1 {
            color: var(--accent);
            font-size: 1.8rem;
            font-weight: 800;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .logo p {
            color: var(--text-muted);
            font-size: 0.9rem;
            letter-spacing: 2px;
        }

        .header-controls {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .seller-badge {
            display: none;
            background: rgba(0, 255, 136, 0.1);
            color: var(--accent);
            padding: 0.3rem 0.8rem;
            border-radius: 4px;
            border: 1px solid var(--accent);
            font-size: 0.8rem;
            font-weight: 600;
        }

        .btn {
            background: transparent;
            color: var(--text-main);
            border: 1px solid var(--border);
            padding: 0.6rem 1.2rem;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.2s ease;
        }

        .btn:hover {
            border-color: var(--text-muted);
        }

        .btn-accent {
            background: var(--accent);
            color: var(--bg);
            border: none;
        }

        .btn-accent:hover {
            background: var(--accent-hover);
            color: var(--bg);
        }

        .btn-danger {
            color: var(--danger);
            border-color: var(--danger);
        }
        .btn-danger:hover {
            background: rgba(255, 68, 68, 0.1);
            border-color: var(--danger);
        }

        /* --- Main Layout --- */
        .container {
            display: flex;
            flex-direction: column;
            padding: 2rem 5%;
            gap: 2rem;
            max-width: 1600px;
            margin: 0 auto;
        }

        @media (min-width: 1024px) {
            .container {
                flex-direction: row;
                align-items: flex-start;
            }
        }

        /* --- Steps Area --- */
        .steps-wrapper {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }

        .step-section {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 8px;
            overflow: hidden;
            transition: all 0.3s;
        }

        .step-header {
            padding: 1.2rem 1.5rem;
            background: rgba(255,255,255,0.02);
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            user-select: none;
        }

        .step-header:hover {
            background: rgba(255,255,255,0.04);
        }

        .step-title {
            font-size: 1.2rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .step-number {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 28px;
            height: 28px;
            background: var(--border);
            color: var(--text-muted);
            border-radius: 50%;
            font-size: 0.9rem;
            font-weight: bold;
        }

        .step-section.active .step-number {
            background: var(--accent);
            color: var(--bg);
        }

        .step-section.completed .step-title {
            color: var(--accent);
        }

        .step-selection-info {
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        .step-content {
            display: none;
            padding: 1.5rem;
            border-top: 1px solid var(--border);
        }

        .step-section.active .step-content {
            display: block;
        }

        .step-tools {
            display: flex;
            gap: 1rem;
            margin-bottom: 1.5rem;
            flex-wrap: wrap;
        }

        .search-input, .sort-select {
            background: var(--bg);
            border: 1px solid var(--border);
            color: var(--text-main);
            padding: 0.6rem 1rem;
            border-radius: 6px;
            outline: none;
        }

        .search-input {
            flex: 1;
            min-width: 200px;
        }

        .search-input:focus, .sort-select:focus {
            border-color: var(--accent);
        }

        .product-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 1rem;
        }

        .product-card {
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 1.2rem;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .product-card:hover {
            background: #0f0f0f;
            border-color: #333;
        }

        .product-card.selected {
            border-color: var(--accent);
            background: rgba(0, 255, 136, 0.05);
        }

        .product-card.disabled {
            opacity: 0.4;
            cursor: not-allowed;
            pointer-events: none;
        }

        .product-name {
            font-weight: 600;
            font-size: 1rem;
            margin-bottom: 0.5rem;
        }

        .product-meta {
            font-size: 0.8rem;
            color: var(--text-muted);
            margin-bottom: 0.8rem;
        }

        .product-price-box {
            display: flex;
            flex-direction: column;
            gap: 0.3rem;
            margin-top: auto;
            border-top: 1px solid var(--border);
            padding-top: 0.8rem;
        }

        .client-price {
            display: none; /* Hidden for clients on individual items by default per prompt */
        }

        /* Platform specific styling */
        .platform-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
        }

        .platform-card {
            text-align: center;
            padding: 2rem;
            font-size: 1.5rem;
        }

        .platform-card.intel:hover, .platform-card.intel.selected { border-color: #0068b5; background: rgba(0, 104, 181, 0.1); }
        .platform-card.amd:hover, .platform-card.amd.selected { border-color: #ed1c24; background: rgba(237, 28, 36, 0.1); }


        /* --- Seller UI Elements --- */
        .seller-ui {
            display: none;
            font-size: 0.85rem;
            background: rgba(0,0,0,0.3);
            padding: 0.5rem;
            border-radius: 4px;
            margin-top: 0.5rem;
        }

        .seller-ui input {
            background: var(--bg);
            border: 1px solid var(--border);
            color: var(--text-main);
            width: 60px;
            padding: 0.2rem;
            margin-left: 5px;
            border-radius: 3px;
        }

        .seller-mode-active .seller-ui {
            display: block;
        }

        .seller-settings {
            display: none;
            background: var(--card-bg);
            border: 1px dashed var(--accent);
            padding: 1rem;
            border-radius: 8px;
            margin-bottom: 1.5rem;
            gap: 1.5rem;
            align-items: center;
        }

        .seller-mode-active .seller-settings {
            display: flex;
            flex-wrap: wrap;
        }
        
        .seller-setting-group {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .seller-setting-group input {
            background: var(--bg);
            border: 1px solid var(--border);
            color: var(--text-main);
            padding: 0.4rem;
            border-radius: 4px;
            width: 100px;
        }


        /* --- Sidebar Summary --- */
        .summary-sidebar {
            width: 100%;
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 8px;
            position: sticky;
            top: 6rem;
            padding: 1.5rem;
        }

        @media (min-width: 1024px) {
            .summary-sidebar {
                width: 380px;
                flex-shrink: 0;
            }
        }

        .summary-title {
            font-size: 1.3rem;
            margin-bottom: 1.5rem;
            padding-bottom: 1rem;
            border-bottom: 1px solid var(--border);
        }

        .summary-items {
            display: flex;
            flex-direction: column;
            gap: 1rem;
            margin-bottom: 1.5rem;
        }

        .summary-item {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            font-size: 0.9rem;
        }

        .summary-item-label {
            color: var(--text-muted);
            width: 40%;
        }

        .summary-item-value {
            width: 55%;
            font-weight: 500;
            text-align: right;
        }

        .summary-item-remove {
            width: 5%;
            color: var(--danger);
            cursor: pointer;
            text-align: right;
            opacity: 0.5;
        }
        .summary-item-remove:hover { opacity: 1; }

        .fps-estimator {
            background: rgba(0, 255, 136, 0.1);
            border: 1px solid rgba(0, 255, 136, 0.3);
            border-radius: 6px;
            padding: 1rem;
            margin-bottom: 1.5rem;
            text-align: center;
            display: none;
        }

        .fps-estimator.active {
            display: block;
        }

        .fps-title {
            font-size: 0.85rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 0.3rem;
        }

        .fps-value {
            font-size: 1.5rem;
            font-weight: 800;
            color: var(--accent);
        }

        .total-section {
            border-top: 1px solid var(--border);
            padding-top: 1.5rem;
            margin-bottom: 1.5rem;
        }

        .total-label {
            font-size: 1rem;
            color: var(--text-muted);
            margin-bottom: 0.5rem;
        }

        .total-price {
            font-size: 2rem;
            font-weight: 800;
            color: var(--accent);
            line-height: 1.2;
        }

        .seller-totals {
            display: none;
            margin-top: 1rem;
            padding: 1rem;
            background: #000;
            border-radius: 6px;
            font-size: 0.9rem;
        }

        .seller-mode-active .seller-totals {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .seller-total-row {
            display: flex;
            justify-content: space-between;
            color: var(--text-muted);
        }

        .seller-total-row.profit {
            color: var(--success);
            font-weight: 600;
            border-top: 1px dashed #333;
            padding-top: 0.5rem;
            margin-top: 0.2rem;
        }

        .sidebar-actions {
            display: flex;
            flex-direction: column;
            gap: 0.8rem;
        }

        .btn-telegram {
            background: #2AABEE;
            color: white;
            border: none;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 0.5rem;
            font-size: 1.1rem;
            padding: 1rem;
            text-decoration: none;
        }
        .btn-telegram:hover {
            background: #229ED9;
        }

        @media print {
            header, .steps-wrapper, .sidebar-actions, .seller-settings {
                display: none !important;
            }
            .summary-sidebar {
                width: 100%;
                border: none;
                position: static;
            }
            body {
                background: white;
                color: black;
            }
            .summary-item-label { color: #555; }
            .total-price { color: black; }
        }

    </style>
</head>

                { id: 'ca23', name: "Montech KING 45 PRO Black", price: 99 },
                { id: 'ca24', name: "FSP M580 Black", price: 105 },
                { id: 'ca25', name: "Montech HS01 PRO Black", price: 113 },
                { id: 'ca26', name: "FSP CUT593P Black", price: 120 },
                { id: 'ca27', name: "Montech KING 95 Pro Black", price: 133 },
                { id: 'ca28', name: "Deepcool CL6600 (suvli sovutish bilan)", price: 180 }
            ]
        };

        const stepsDef = [
            { id: 'platform', title: 'Platforma' },
            { id: 'cpu', title: 'Protsessor (CPU)' },
            { id: 'mb', title: 'Ona plata (Motherboard)' },
            { id: 'ram', title: 'Operativ xotira (RAM)' },
            { id: 'gpu', title: 'Videokarta (GPU)' },
            { id: 'storage', title: 'Xotira (SSD/HDD)' },
            { id: 'cooler', title: 'Sovutish tizimi (Cooler)' },
            { id: 'psu', title: 'Blok pitaniya (PSU)' },
            { id: 'case', title: 'Korpus (Case)' }
        ];

        // ==========================================
        // 2. STATE (Holat boshqaruvi)
        // ==========================================
        let state = {
            config: {
                platform: null, cpu: null, mb: null, ram: null, gpu: null, 
                storage: null, cooler: null, psu: null, case: null
            },
            settings: {
                sellerMode: false,
                exchangeRate: 12850,
                globalMargin: 20,
                itemMargins: {} // { 'c1': 25, 'mb2': 15 }
            },
            ui: {
                activeStepIndex: 0
            }
        };

        // Load from LocalStorage
        function loadState() {
            const saved = localStorage.getItem('texnoConfigState');
            if (saved) {
                try {
                    const parsed = JSON.parse(saved);
                    // faqat mos ID larni obyekti bilan yuklash
                    state.settings = parsed.settings || state.settings;
                    
                    // Re-link objects from DB based on saved IDs
                    if(parsed.config) {
                        for(const step of stepsDef) {
                            const savedId = parsed.config[step.id];
                            if(savedId && db[step.id]) {
                                const found = db[step.id].find(item => item.id === savedId);
                                if(found) state.config[step.id] = found;
                            }
                        }
                    }
                } catch(e) {}
            }
        }

        function saveState() {
            // Save only IDs for config
            const saveObj = {
                settings: state.settings,
                config: {}
            };
            for(const step of stepsDef) {
                if(state.config[step.id]) {
                    saveObj.config[step.id] = state.config[step.id].id;
                }
            }
            localStorage.setItem('texnoConfigState', JSON.stringify(saveObj));
        }

        // ==========================================
        // 3. LOGIC (Moslik va hisoblar)
        // ==========================================

        function checkCompatibility(stepId, item) {
            // 1. CPU depends on Platform
            if (stepId === 'cpu' && state.config.platform) {
                if (item.type !== state.config.platform.type) return false;
            }
            // 2. MB depends on CPU socket
            if (stepId === 'mb' && state.config.cpu) {
                if (item.socket !== state.config.cpu.socket) return false;
            }
            // 3. RAM depends on MB DDR type
            if (stepId === 'ram' && state.config.mb) {
                if (item.ddr !== state.config.mb.ddr) return false;
            }
            // 4. PSU depends on CPU + GPU + 200W
            if (stepId === 'psu') {
                let requiredWatt = 200; // base + reserve
                if (state.config.cpu && state.config.cpu.tdp) requiredWatt += state.config.cpu.tdp;
                if (state.config.gpu && state.config.gpu.tdp) requiredWatt += state.config.gpu.tdp;
                
                if (item.watt < requiredWatt) return false;
            }
            
            return true;
        }

        function getSellingPrice(item) {
            if (!item || !item.price) return 0;
            const margin = state.settings.itemMargins[item.id] !== undefined 
                ? state.settings.itemMargins[item.id] 
                : state.settings.globalMargin;
            const baseSum = item.price * state.settings.exchangeRate;
            return baseSum * (1 + (margin / 100));
        }

        function estimateFPS() {
            if (!state.config.cpu || !state.config.gpu) return null;
            
            // Heuristic FPS estimation for CS2 1080p High
            const cpuTier = state.config.cpu.tier || 1;
            const gpuTier = state.config.gpu.tier || 1;
            
            let baseFps = 80; // minimum playable
            
            // GPU is main bottleneck in CS2 but CPU matters a lot
            baseFps += (gpuTier * 30);
            baseFps += (cpuTier * 20);
            
            // X3D processors give massive boost in CS2
            if (state.config.cpu.name.includes("X3D")) baseFps += 70;
            
            // Cap reasonable values
            if (baseFps > 600) baseFps = "500+";
            
            return baseFps;
        }

        // ==========================================
        // 4. UI RENDERING
        // ==========================================

        function renderApp() {
            renderHeader();
            renderSteps();
            updateSidebar();
        }

        function renderHeader() {
            document.body.className = state.settings.sellerMode ? 'seller-mode-active' : '';
            document.getElementById('seller-badge').style.display = state.settings.sellerMode ? 'block' : 'none';
            document.getElementById('btn-seller-login').style.display = state.settings.sellerMode ? 'none' : 'block';
            document.getElementById('btn-seller-logout').style.display = state.settings.sellerMode ? 'block' : 'none';
            
            document.getElementById('global-rate').value = state.settings.exchangeRate;
            document.getElementById('global-margin').value = state.settings.globalMargin;
        }

        function renderSteps() {
            const container = document.getElementById('steps-container');
            container.innerHTML = '';

            stepsDef.forEach((step, index) => {
                const section = document.createElement('div');
                const isCompleted = state.config[step.id] !== null;
                const isActive = index === state.ui.activeStepIndex;
                
                section.className = `step-section ${isActive ? 'active' : ''} ${isCompleted ? 'completed' : ''}`;
                
                // Header
                let selectionText = isCompleted ? state.config[step.id].name : 'Tanlanmagan';
                
                section.innerHTML = `
                    <div class="step-header" onclick="toggleStep(${index})">
                        <div class="step-title">
                            <div class="step-number">${index + 1}</div>
                            ${step.title}
                        </div>
                        <div class="step-selection-info">${selectionText}</div>
                    </div>
                    <div class="step-content">
                        <div class="step-tools">
                            <input type="text" class="search-input" placeholder="Qidirish..." onkeyup="filterItems('${step.id}', this.value)" id="search-${step.id}">
                            <select class="sort-select" onchange="sortItems('${step.id}', this.value)" id="sort-${step.id}">
                                <option value="default">Standart</option>
                                <option value="price-asc">Arzondan qimmatga</option>
                                <option value="price-desc">Qimmatdan arzonga</option>
                            </select>
                        </div>
                        <div class="product-grid" id="grid-${step.id}"></div>
                    </div>
                `;
                
                container.appendChild(section);

                if (isActive) {
                    renderGrid(step.id);
                }
            });
        }

        function renderGrid(stepId, searchTerm = '', sortOrder = 'default') {
            const grid = document.getElementById(`grid-${stepId}`);
            if (!grid) return;
            grid.innerHTML = '';

            let items = [...db[stepId]];

            // Search filter
            if (searchTerm) {
                items = items.filter(item => item.name.toLowerCase().includes(searchTerm.toLowerCase()));
            }

            // Sort
            if (sortOrder === 'price-asc') items.sort((a, b) => (a.price || 0) - (b.price || 0));
            if (sortOrder === 'price-desc') items.sort((a, b) => (b.price || 0) - (a.price || 0));

            // Platform has custom render
            if (stepId === 'platform') {
                grid.className = 'platform-grid';
                items.forEach(item => {
                    const isSelected = state.config.platform?.id === item.id;
                    const el = document.createElement('div');
                    el.className = `product-card platform-card ${item.type} ${isSelected ? 'selected' : ''}`;
                    el.innerHTML = `<strong>${item.name}</strong>`;
                    el.onclick = () => selectItem('platform', item);
                    grid.appendChild(el);
                });
                return;
            }

            // Normal products
            items.forEach(item => {
                const isCompatible = checkCompatibility(stepId, item);
                const isSelected = state.config[stepId]?.id === item.id;
                
                let metaText = [];
                if(item.socket) metaText.push(`Socket: ${item.socket}`);
                if(item.ddr) metaText.push(item.ddr);
                if(item.tdp) metaText.push(`TDP: ${item.tdp}W`);
                if(item.watt) metaText.push(`${item.watt}W`);

                const sellingPrice = getSellingPrice(item);
                const currentMargin = state.settings.itemMargins[item.id] !== undefined ? state.settings.itemMargins[item.id] : state.settings.globalMargin;

                const el = document.createElement('div');
                el.className = `product-card ${isSelected ? 'selected' : ''} ${!isCompatible ? 'disabled' : ''}`;
                
                // Content
                el.innerHTML = `
                    <div>
                        <div class="product-name">${item.name}</div>
                        <div class="product-meta">${metaText.join(' | ')}</div>
                        ${!isCompatible ? '<span style="color:var(--danger);font-size:0.8rem;">Mos emas</span>' : ''}
                    </div>
                    <div class="product-price-box">
                        <div class="client-price" style="display:${state.settings.sellerMode ? 'none' : 'block'}; color:var(--accent); font-weight:bold;">
                            <!-- Client shouldn't see individual prices according to prompt, leaving empty or hidden -->
                        </div>
                        <div class="seller-ui" onclick="event.stopPropagation()">
                            <div>Tan narx: <strong style="color:white">$${item.price || 0}</strong></div>
                            <div style="margin-top:5px; display:flex; align-items:center;">
                                Marja %: <input type="number" value="${currentMargin}" onchange="updateItemMargin('${item.id}', this.value); renderApp();">
                            </div>
                            <div style="margin-top:5px; color:var(--success);">Sotuv: ${Math.round(sellingPrice).toLocaleString()} so'm</div>
                        </div>
                    </div>
                `;

                if (isCompatible) {
                    el.onclick = () => selectItem(stepId, item);
                }

                grid.appendChild(el);
            });
        }

        function updateSidebar() {
            const listEl = document.getElementById('summary-items');
            listEl.innerHTML = '';

            let totalBaseUsd = 0;
            let totalSellingUzs = 0;

            stepsDef.forEach(step => {
                const item = state.config[step.id];
                if (!item) return;

                const sellingPrice = getSellingPrice(item);
                totalBaseUsd += item.price || 0;
                totalSellingUzs += sellingPrice;

                const el = document.createElement('div');
                el.className = 'summary-item';
                
                let sellerInfo = '';
                if(state.settings.sellerMode && item.price) {
                    const m = state.settings.itemMargins[item.id] !== undefined ? state.settings.itemMargins[item.id] : state.settings.globalMargin;
                    sellerInfo = `<br><span style="color:var(--text-muted);font-size:0.8rem;">$${item.price} + ${m}% = ${Math.round(sellingPrice).toLocaleString()} so'm</span>`;
                }

                el.innerHTML = `
                    <div class="summary-item-label">${step.title}</div>
                    <div class="summary-item-value">${item.name} ${sellerInfo}</div>
                    <div class="summary-item-remove" onclick="removeItem('${step.id}')" title="O'chirish">✕</div>
                `;
                listEl.appendChild(el);
            });

            // Update Totals
            document.getElementById('total-price').innerText = `${Math.round(totalSellingUzs).toLocaleString()} so'm`;
            
            if (state.settings.sellerMode) {
                document.getElementById('seller-total-base').innerText = `$${totalBaseUsd}`;
                const totalBaseUzs = totalBaseUsd * state.settings.exchangeRate;
                const profit = totalSellingUzs - totalBaseUzs;
                document.getElementById('seller-total-profit').innerText = `${Math.round(profit).toLocaleString()} so'm`;
            }

            // Update FPS
            const fps = estimateFPS();
            const fpsContainer = document.getElementById('fps-estimator');
            if (fps) {
                document.getElementById('fps-value').innerText = `~${fps} FPS`;
                fpsContainer.classList.add('active');
            } else {
                fpsContainer.classList.remove('active');
            }

            // Update Telegram Link
            updateTelegramLink(totalSellingUzs);
        }

        function updateTelegramLink(totalUzs) {
            const btn = document.getElementById('btn-order-tg');
            let text = "Salom! Men Texno Optom PC Konfigurator orqali quyidagi kompyuterni yig'dim:\n\n";
            
            stepsDef.forEach(step => {
                if(state.config[step.id]) {
                    text += `- ${step.title}: ${state.config[step.id].name}\n`;
                }
            });
            
            text += `\nUmumiy narx: ${Math.round(totalUzs).toLocaleString()} so'm\n\nShunga buyurtma bermoqchiman.`;
            
            btn.href = `https://t.me/texnooptom?text=${encodeURIComponent(text)}`;
        }

        // ==========================================
        // 5. ACTIONS
        // ==========================================

        function selectItem(stepId, item) {
            // If already selected, do nothing
            if (state.config[stepId]?.id === item.id) return;
            
            state.config[stepId] = item;

            // Cascade clear dependents
            if (stepId === 'platform') {
                state.config.cpu = null; state.config.mb = null; state.config.ram = null; state.config.cooler = null;
            } else if (stepId === 'cpu') {
                state.config.mb = null; state.config.ram = null;
            } else if (stepId === 'mb') {
                state.config.ram = null;
            } else if (stepId === 'gpu') {
                state.config.psu = null; // Recheck PSU wattage
            }

            // Auto-advance step
            const currentIdx = stepsDef.findIndex(s => s.id === stepId);
            if (currentIdx < stepsDef.length - 1) {
                state.ui.activeStepIndex = currentIdx + 1;
            }

            saveState();
            renderApp();
        }

        function removeItem(stepId) {
            state.config[stepId] = null;
            
            // Cascade clear
            if (stepId === 'platform') {
                state.config.cpu = null; state.config.mb = null; state.config.ram = null;
            } else if (stepId === 'cpu') {
                state.config.mb = null; state.config.ram = null;
            } else if (stepId === 'mb') {
                state.config.ram = null;
            }

            saveState();
            renderApp();
        }

        function toggleStep(index) {
            state.ui.activeStepIndex = index;
            renderSteps();
        }

        function filterItems(stepId, val) {
            renderGrid(stepId, val, document.getElementById(`sort-${stepId}`).value);
        }

        function sortItems(stepId, val) {
            renderGrid(stepId, document.getElementById(`search-${stepId}`).value, val);
        }

        function updateItemMargin(itemId, marginVal) {
            state.settings.itemMargins[itemId] = parseFloat(marginVal) || 0;
            saveState();
        }

        // ==========================================
        // 6. EVENT LISTENERS
        // ==========================================

        document.getElementById('btn-seller-login').addEventListener('click', () => {
            const pwd = prompt("Sotuvchi parolini kiriting:");
            if (pwd === 'texno2024') {
                state.settings.sellerMode = true;
                saveState();
                renderApp();
            } else if (pwd !== null) {
                alert("Noto'g'ri parol!");
            }
        });

        document.getElementById('btn-seller-logout').addEventListener('click', () => {
            state.settings.sellerMode = false;
            saveState();
            renderApp();
        });

        document.getElementById('global-rate').addEventListener('change', (e) => {
            state.settings.exchangeRate = parseFloat(e.target.value) || 12850;
            saveState();
            updateSidebar();
            renderSteps(); // to update prices in grid
        });

        document.getElementById('global-margin').addEventListener('change', (e) => {
            state.settings.globalMargin = parseFloat(e.target.value) || 0;
            saveState();
            updateSidebar();
            renderSteps();
        });

        document.getElementById('btn-clear-config').addEventListener('click', () => {
            if(confirm("Barcha tanlangan detallarni o'chirmoqchimisiz?")) {
                state.config = { platform: null, cpu: null, mb: null, ram: null, gpu: null, storage: null, cooler: null, psu: null, case: null };
                state.ui.activeStepIndex = 0;
                saveState();
                renderApp();
            }
        });

        // ==========================================
        // 7. INITIALIZATION
        // ==========================================
        
        // Populate specific steps data arrays
        db.storage = storageList;
        db.cooler = coolerList;
        db.psu = psuList;
        db.case = caseList;
        db.cpu = cpuList;
        db.mb = mbList;
        db.ram = ramList;
        db.gpu = gpuList;

        window.onload = () => {
            // Bind external list data
            loadState();
            renderApp();
        };

        // Re-declaring the user provided arrays above in the initialization to avoid scope issues
        const cpuList = db.cpu;
        const mbList = db.mb;
        const ramList = db.ram;
        const gpuList = db.gpu;
        const storageList = db.storage;
        const coolerList = db.cooler;
        const psuList = db.psu;
        const caseList = db.case;

    </script>
</body>
</html>
